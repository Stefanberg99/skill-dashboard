<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Skill Dashboard</title>
<meta name="description" content="All installed Claude skills in one place — searchable, filterable, always up to date.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#080808;color:#c8c8c8;min-height:100vh}

.hdr{background:#0b0b0b;border-bottom:1px solid #161616;padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;transition:border-color .4s}
.hdr.flash{border-bottom-color:#38bdf850}
.logo{font-size:15px;font-weight:700;color:#f0f0f0;letter-spacing:-.3px}
.logo em{color:#333;font-style:normal;font-weight:400}
.sync-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:#282828}
.sdot{width:6px;height:6px;border-radius:50%;background:#22c55e;opacity:.25;transition:opacity .3s}
.sdot.active{opacity:1;animation:blink 1.5s ease-in-out 3}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.hdr-r{display:flex;align-items:center;gap:14px}
.hdr-ct{font-size:12px;color:#2a2a2a}.hdr-ct b{color:#555;font-weight:600}
.hdr-ts{font-size:11px;color:#1e1e1e}

.ctrl{background:#080808;border-bottom:1px solid #101010;padding:14px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:56px;z-index:100}
.sw{position:relative;flex:1;max-width:480px;min-width:180px}
.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#2c2c2c;pointer-events:none}
input[type=search]{width:100%;background:#0d0d0d;border:1px solid #1c1c1c;border-radius:9px;color:#d8d8d8;padding:10px 36px;font-size:13.5px;outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none}
input[type=search]:focus{border-color:#2c2c2c;background:#0f0f0f}
input[type=search]::placeholder{color:#262626}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.clr{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:none;color:#2e2e2e;cursor:pointer;font-size:14px;display:none;line-height:1;padding:2px}
.clr.on{display:block}.clr:hover{color:#888}
.sep{width:1px;height:20px;background:#181818}
.filters{display:flex;gap:5px;flex-wrap:wrap}
.fb{display:flex;align-items:center;gap:6px;background:#0d0d0d;border:1px solid #1c1c1c;border-radius:7px;color:#444;cursor:pointer;font-size:12px;font-weight:500;padding:7px 12px;transition:all .15s;white-space:nowrap}
.fb:hover{border-color:#2c2c2c;color:#aaa}
.fb.on{background:#f4f4f4;color:#111;border-color:#f4f4f4;font-weight:600}
.fb .dot-f{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.fb .n{font-size:10px;font-weight:700;background:#0000001a;border-radius:3px;padding:1px 5px;min-width:20px;text-align:center}
.fb.on .n{background:#00000015}

.body{padding:22px 28px 80px}
.section{margin-bottom:32px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.sl{flex:1;height:1px;background:#101010}
.st{font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#252525;display:flex;align-items:center;gap:7px;white-space:nowrap}
.sd{width:7px;height:7px;border-radius:50%}
.sc{font-size:10px;color:#202020;font-weight:400;letter-spacing:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}

.card{background:#0c0c0c;border:1px solid #181818;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .18s,box-shadow .18s,transform .18s}
.card:hover{border-color:#272727;transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.55)}
.cbar{height:3px;flex-shrink:0}
.cin{padding:18px 18px 0;flex:1;display:flex;flex-direction:column}
.ctop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cicon{font-size:22px;line-height:1}
.cbadge{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.cname{font-size:15px;font-weight:700;color:#f0f0f0;line-height:1.25;letter-spacing:-.2px;margin-bottom:10px}
.cwhat{font-size:12.5px;color:#6a6a6a;line-height:1.65;flex:1}
.cwhen-w{margin-top:12px;padding-top:12px;border-top:1px solid #131313}
.cwhen-l{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#2a2a2a;margin-bottom:5px}
.cwhen{font-size:12px;color:#424242;line-height:1.6}
.cfoot{padding:13px 18px;margin-top:14px;border-top:1px solid #101010;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ccmd{font-family:'SF Mono','Menlo','Monaco',monospace;font-size:11.5px;color:#323232;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccopy{font-size:10px;font-weight:600;color:#262626;cursor:pointer;padding:4px 9px;border-radius:5px;border:1px solid #1c1c1c;transition:all .15s;white-space:nowrap;flex-shrink:0;user-select:none}
.ccopy:hover{color:#888;border-color:#303030}
.ccopy.ok{color:#22c55e;border-color:#22c55e40;background:#22c55e0a}

.empty{grid-column:1/-1;text-align:center;padding:80px 0;color:#1e1e1e;font-size:14px}
.empty span{display:block;font-size:32px;margin-bottom:12px;opacity:.25}

.toast{position:fixed;bottom:24px;right:24px;z-index:999;background:#111;border:1px solid #222;border-radius:8px;padding:10px 16px;font-size:12px;color:#777;transform:translateY(16px);opacity:0;transition:all .25s;pointer-events:none}
.toast.show{transform:none;opacity:1}

.no-data{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;color:#1e1e1e;text-align:center;padding:40px}
.no-data-icon{font-size:48px;opacity:.15}
.no-data h2{font-size:18px;font-weight:600;color:#2a2a2a}
.no-data p{font-size:13px;line-height:1.6;max-width:380px}
</style>
</head>
<body>

<div class="hdr" id="hdr">
  <div style="display:flex;align-items:center;gap:16px">
    <div class="logo">Skills <em>/ Claude</em></div>
    <div class="sync-badge"><div class="sdot" id="sdot"></div><span id="sl">auto-sync</span></div>
  </div>
  <div class="hdr-r">
    <span class="hdr-ct"><b id="vc">0</b> / <b id="tc">0</b></span>
    <span class="hdr-ts" id="ts">—</span>
  </div>
</div>

<div style="background:#0b0b0b;border-bottom:1px solid #161616;padding:0 28px;display:flex;gap:0">
  <a href="/" style="font-size:12px;font-weight:500;color:#e0e0e0;padding:10px 16px;text-decoration:none;border-bottom:2px solid #e0e0e0;letter-spacing:.1px">Skills</a>
  <a href="/recommendations" style="font-size:12px;font-weight:500;color:#333;padding:10px 16px;text-decoration:none;border-bottom:2px solid transparent;letter-spacing:.1px">Recommendations</a>
</div>

<div class="ctrl">
  <div class="sw">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="q" placeholder="Search by name, capability, or use case…" autocomplete="off">
    <button class="clr" id="clr">✕</button>
  </div>
  <div class="sep"></div>
  <div class="filters" id="flt">
    <button class="fb on" data-src="all">
      <span>All</span><span class="n" id="all-n">0</span>
    </button>
  </div>
</div>

<div class="body" id="body">
  <div class="no-data">
    <div class="no-data-icon">◆</div>
    <h2>Loading skills…</h2>
    <p>Fetching the latest skill data. If this persists, the sync daemon may not have run yet.</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let skills=[], activeSrc='all', searchQ='', hash='', syncedAt=null;

const SRC_IC={anthropic:'✦',vercel:'▲',supabase:'⚡',scheduled:'⏱',personal:'⚙',plugin:'◈'};
function ic(name,src){
  const n=name.toLowerCase();
  if(/design|canvas|figma|theme|brand/.test(n))return'🎨';
  if(/video|youtube|record/.test(n))return'🎬';
  if(/pdf|docx|pptx|xlsx|word|excel|spreadsheet/.test(n))return'📄';
  if(/research|deep.research/.test(n))return'🔍';
  if(/schedule|cron|remind/.test(n))return'⏱';
  if(/memory|obsidian|knowledge|vault|notebook/.test(n))return'🧠';
  if(/\bdeploy\b|launch/.test(n))return'🚀';
  if(/review|debug|test|security|audit|simplif/.test(n))return'🔎';
  if(/\bsdk\b|\bapi\b|agent|mcp|connect/.test(n))return'⚙';
  if(/code|build|\bdev\b/.test(n))return'⚡';
  if(/writ|content|blog|copy/.test(n))return'✍';
  if(/image|art|photo/.test(n))return'🖼';
  if(/twitter|social|viral/.test(n))return'📢';
  if(/pinecone|vector/.test(n))return'🗃';
  if(/parallel|swarm|dispatch|ruflo/.test(n))return'⚙';
  if(/notebooklm/.test(n))return'📓';
  if(/dream|goal|mission/.test(n))return'🎯';
  if(/supabase|postgres|database/.test(n))return'🗄';
  if(/loop|repeat/.test(n))return'🔄';
  if(/next|react|shadcn|turbo/.test(n))return'⚛';
  if(/auth|firewall/.test(n))return'🔒';
  if(/meeting|insight|transcript/.test(n))return'🎙';
  return SRC_IC[src]||'◆';
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function trunc(t,n){if(!t||t.length<=n)return t||'';return t.slice(0,n).replace(/\s\S*$/,'')+'…'}

function ago(isoStr){
  if(!isoStr)return'—';
  const s=Math.round((Date.now()-new Date(isoStr))/1000);
  if(s<60)return'synced just now';
  const m=Math.floor(s/60);
  if(m<60)return`synced ${m}m ago`;
  const h=Math.floor(m/60);
  if(h<24)return`synced ${h}h ago`;
  return`synced ${Math.floor(h/24)}d ago`;
}

function updateSyncTime(){
  document.getElementById('ts').textContent=ago(syncedAt);
}

function buildFilters(){
  const counts={};
  skills.forEach(s=>{if(!counts[s.source])counts[s.source]={label:s.source_label,color:s.source_color,n:0};counts[s.source].n++;});
  const flt=document.getElementById('flt');
  const allBtn=flt.querySelector('[data-src=all]');
  flt.innerHTML='';flt.appendChild(allBtn);
  document.getElementById('all-n').textContent=skills.length;
  const order=['personal','anthropic','vercel','supabase','plugin','scheduled'];
  Object.entries(counts).sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0])).forEach(([k,v])=>{
    const b=document.createElement('button');
    b.className='fb'+(k===activeSrc?' on':'');b.dataset.src=k;
    b.innerHTML=`<span class="dot-f" style="background:${esc(v.color)}40;border:1px solid ${esc(v.color)}60;border-radius:50%"></span><span>${esc(v.label)}</span><span class="n">${v.n}</span>`;
    flt.appendChild(b);
  });
  flt.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{
    activeSrc=b.dataset.src;flt.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));b.classList.add('on');render();
  }));
}

function render(){
  const body=document.getElementById('body');
  if(!skills.length){
    body.innerHTML=`<div class="no-data"><div class="no-data-icon">◆</div><h2>No skills synced yet</h2><p>The sync daemon hasn't pushed any data yet. Start the daemon and wait up to 60 seconds.</p></div>`;
    return;
  }
  const q=searchQ.toLowerCase();
  const order=['personal','anthropic','vercel','supabase','plugin','scheduled'];
  const groups={};let vis=0;
  skills.forEach(s=>{
    const ms=activeSrc==='all'||s.source===activeSrc;
    const mq=!q||(s.name+' '+s.what+' '+s.when+' '+s.raw_desc).toLowerCase().includes(q);
    if(!ms||!mq)return;
    if(!groups[s.source])groups[s.source]={label:s.source_label,color:s.source_color,items:[]};
    groups[s.source].items.push(s);vis++;
  });
  document.getElementById('vc').textContent=vis;
  document.getElementById('tc').textContent=skills.length;
  body.innerHTML='';
  if(vis===0){body.innerHTML='<div class="grid"><div class="empty"><span>🔍</span>Nothing matches — try different keywords.</div></div>';return;}
  const keys=Object.keys(groups).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  keys.forEach(src=>{
    const g=groups[src];
    const sec=document.createElement('div');sec.className='section';
    sec.innerHTML=`<div class="sh"><div class="sl"></div><div class="st"><div class="sd" style="background:${esc(g.color)}"></div>${esc(g.label)}<span class="sc">${g.items.length}</span></div><div class="sl"></div></div><div class="grid"></div>`;
    body.appendChild(sec);
    const grid=sec.querySelector('.grid');
    g.items.forEach(s=>grid.appendChild(card(s)));
  });
}

function card(s){
  const i=ic(s.name,s.source);
  const what=trunc(s.what||s.raw_desc||'',200);
  const when=trunc(s.when||'',160);
  const cmd='/'+s.folder;
  const bs=`background:${s.source_color}12;color:${s.source_color};border:1px solid ${s.source_color}25`;
  const el=document.createElement('div');el.className='card';
  el.innerHTML=`
    <div class="cbar" style="background:${esc(s.source_color)}"></div>
    <div class="cin">
      <div class="ctop">
        <div class="cicon">${i}</div>
        <div class="cbadge" style="${bs}">${esc(s.source_label)}</div>
      </div>
      <div class="cname">${esc(s.name)}</div>
      ${what?`<div class="cwhat">${esc(what)}</div>`:''}
      ${when?`<div class="cwhen-w"><div class="cwhen-l">Use for</div><div class="cwhen">${esc(when)}</div></div>`:''}
    </div>
    <div class="cfoot">
      <span class="ccmd">${esc(cmd)}</span>
      <span class="ccopy" data-cmd="${esc(cmd)}">Copy</span>
    </div>`;
  el.querySelector('.ccopy').addEventListener('click',e=>{
    e.stopPropagation();const btn=e.currentTarget;
    navigator.clipboard.writeText(btn.dataset.cmd).then(()=>{
      btn.textContent='Copied ✓';btn.classList.add('ok');
      setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('ok');},1500);
    });
  });
  return el;
}

const qEl=document.getElementById('q'),clrEl=document.getElementById('clr');
qEl.addEventListener('input',e=>{searchQ=e.target.value;clrEl.classList.toggle('on',searchQ.length>0);render();});
clrEl.addEventListener('click',()=>{qEl.value='';searchQ='';clrEl.classList.remove('on');qEl.focus();render();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}if(e.key==='Escape')qEl.blur();});

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function flashHdr(){
  const h=document.getElementById('hdr'),dot=document.getElementById('sdot');
  h.classList.add('flash');dot.classList.add('active');
  setTimeout(()=>{h.classList.remove('flash');dot.classList.remove('active');},2200);
}

async function load(isUpdate){
  try{
    const r=await fetch('/skills.json?_='+Date.now(),{cache:'no-cache'});
    const data=await r.json();
    const newHash=data.hash||'';
    if(newHash!==hash){
      const wasEmpty=hash==='';
      hash=newHash;
      skills=data.skills||[];
      syncedAt=data.synced_at||null;
      buildFilters();
      render();
      updateSyncTime();
      if(isUpdate&&!wasEmpty){flashHdr();toast('Skills updated — '+skills.length+' total');}
    }else{
      updateSyncTime();
    }
  }catch(e){console.error('Failed to load skills.json:',e);}
}

setInterval(updateSyncTime,30000);
load(false);
setInterval(()=>load(true),60000);
</script>
</body>
</html>
