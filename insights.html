<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session Insights — Claude Skill Dashboard</title>
<meta name="description" content="Session insights and things built — logged automatically by Aurelius after each conversation.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#080808;color:#c8c8c8;min-height:100vh}

/* ─── Header ─── */
.hdr{background:#0b0b0b;border-bottom:1px solid #161616;padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200}
.logo{font-size:15px;font-weight:700;color:#f0f0f0;letter-spacing:-.3px}
.logo em{color:#333;font-style:normal;font-weight:400}
.sync-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:#282828}
.sdot{width:6px;height:6px;border-radius:50%;background:#22c55e;opacity:.35}
.hdr-r{display:flex;align-items:center;gap:14px}
.hdr-ct{font-size:12px;color:#2a2a2a}.hdr-ct b{color:#555;font-weight:600}
.hdr-ts{font-size:11px;color:#1e1e1e}

/* ─── Nav ─── */
.nav{background:#0b0b0b;border-bottom:1px solid #161616;padding:0 28px;display:flex;gap:0;position:sticky;top:56px;z-index:150}
.nav a{font-size:12px;font-weight:500;color:#333;padding:10px 16px;text-decoration:none;border-bottom:2px solid transparent;letter-spacing:.1px;transition:color .15s}
.nav a:hover{color:#888}
.nav a.on{color:#e0e0e0;border-bottom-color:#e0e0e0}

/* ─── Stats strip ─── */
.stats-strip{padding:16px 28px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-bottom:1px solid #101010}
.stat-box{background:#0c0c0c;border:1px solid #181818;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat-val{font-size:22px;font-weight:700;color:#e0e0e0;letter-spacing:-.5px;line-height:1}
.stat-lbl{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#2a2a2a;margin-top:2px}
.stat-sub{font-size:11px;color:#323232;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ─── Sticky ctrl bar ─── */
.ctrl{background:#080808;border-bottom:1px solid #101010;padding:12px 28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:96px;z-index:100}
.sw{position:relative;flex:1;max-width:420px;min-width:160px}
.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#2c2c2c;pointer-events:none}
input[type=search]{width:100%;background:#0d0d0d;border:1px solid #1c1c1c;border-radius:9px;color:#d8d8d8;padding:9px 12px 9px 36px;font-size:13px;outline:none;transition:border-color .15s;appearance:none;-webkit-appearance:none}
input[type=search]:focus{border-color:#2c2c2c;background:#0f0f0f}
input[type=search]::placeholder{color:#262626}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.sep{width:1px;height:18px;background:#181818}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.fb{display:flex;align-items:center;gap:5px;background:#0d0d0d;border:1px solid #1c1c1c;border-radius:7px;color:#444;cursor:pointer;font-size:11px;font-weight:500;padding:6px 11px;transition:all .15s;white-space:nowrap}
.fb:hover{border-color:#2c2c2c;color:#aaa}
.fb.on{background:#f4f4f4;color:#111;border-color:#f4f4f4;font-weight:600}
.fb .dot-f{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.fb .n{font-size:10px;font-weight:700;background:#0000001a;border-radius:3px;padding:1px 5px;min-width:18px;text-align:center}
.fb.on .n{background:#00000015}

/* ─── Body ─── */
.body{padding:22px 28px 80px}
.section{margin-bottom:32px}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.sl{flex:1;height:1px;background:#101010}
.st{font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#252525;display:flex;align-items:center;gap:7px;white-space:nowrap}
.sd{width:7px;height:7px;border-radius:50%}
.sc{font-size:10px;color:#202020;font-weight:400;letter-spacing:0}

/* ─── Grid ─── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}

/* ─── Session Card ─── */
.card{background:#0c0c0c;border:1px solid #181818;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .18s,box-shadow .18s,transform .18s;cursor:default}
.card:hover{border-color:#272727;transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.55)}
.cbar{height:3px;flex-shrink:0}
.cin{padding:18px 18px 0;flex:1;display:flex;flex-direction:column}
.ctop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.cbadge{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.cdate{font-size:11px;color:#2a2a2a;flex-shrink:0}
.cname{font-size:15px;font-weight:700;color:#f0f0f0;line-height:1.25;letter-spacing:-.2px;margin-bottom:8px}
.csummary{font-size:12.5px;color:#6a6a6a;line-height:1.65;flex:1}
.ctopics{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.ctopic{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.csec{margin-top:12px;padding-top:12px;border-top:1px solid #131313}
.csec-lbl{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#2a2a2a;margin-bottom:6px}
.cchips{display:flex;flex-wrap:wrap;gap:5px}
.cchip{font-size:11px;color:#383838;background:#0f0f0f;border:1px solid #1a1a1a;border-radius:5px;padding:3px 9px;line-height:1.5}
.cfoot{padding:13px 18px;margin-top:14px;border-top:1px solid #101010;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cprompt{font-family:'SF Mono','Menlo','Monaco',monospace;font-size:11px;color:#2a2a2a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.ccopy{font-size:10px;font-weight:600;color:#262626;cursor:pointer;padding:4px 9px;border-radius:5px;border:1px solid #1c1c1c;transition:all .15s;white-space:nowrap;flex-shrink:0;user-select:none}
.ccopy:hover{color:#888;border-color:#303030}
.ccopy.ok{color:#22c55e;border-color:#22c55e40;background:#22c55e0a}

/* ─── Empty / no-data ─── */
.empty{grid-column:1/-1;text-align:center;padding:80px 0;color:#1e1e1e;font-size:14px}
.empty span{display:block;font-size:32px;margin-bottom:12px;opacity:.25}
.empty h3{font-size:16px;font-weight:600;color:#252525;margin-bottom:8px}
.empty p{font-size:12.5px;color:#1e1e1e;max-width:340px;margin:0 auto;line-height:1.6}
.no-data{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:16px;color:#1e1e1e;text-align:center;padding:40px}
.no-data-icon{font-size:48px;opacity:.15}
.no-data h2{font-size:18px;font-weight:600;color:#2a2a2a}
.no-data p{font-size:13px;line-height:1.6;max-width:380px;color:#252525}

/* ─── Toast ─── */
.toast{position:fixed;bottom:24px;right:24px;z-index:999;background:#111;border:1px solid #222;border-radius:8px;padding:10px 16px;font-size:12px;color:#777;transform:translateY(16px);opacity:0;transition:all .25s;pointer-events:none}
.toast.show{transform:none;opacity:1}
</style>
</head>
<body>

<!-- ─── Header ─── -->
<div class="hdr">
  <div style="display:flex;align-items:center;gap:16px">
    <div class="logo">Skills <em>/ Claude</em></div>
    <div class="sync-badge"><div class="sdot"></div><span>live</span></div>
  </div>
  <div class="hdr-r">
    <span class="hdr-ct"><b id="vc">0</b> sessions</span>
    <span class="hdr-ts" id="ts">—</span>
  </div>
</div>

<!-- ─── Nav ─── -->
<div class="nav">
  <a href="/">Skills</a>
  <a href="/recommendations">Recommendations</a>
  <a href="/insights" class="on">Insights</a>
</div>

<!-- ─── Stats strip ─── -->
<div class="stats-strip" id="stats-strip">
  <div class="stat-box">
    <div class="stat-val" id="stat-sessions">--</div>
    <div class="stat-lbl">Sessions tracked</div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="stat-built">--</div>
    <div class="stat-lbl">Things built</div>
    <div class="stat-sub" id="stat-built-sub"></div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="stat-topic">--</div>
    <div class="stat-lbl">Top topic</div>
    <div class="stat-sub" id="stat-topic-sub"></div>
  </div>
  <div class="stat-box">
    <div class="stat-val" id="stat-recs">--</div>
    <div class="stat-lbl">Recs completed</div>
  </div>
</div>

<!-- ─── Ctrl bar ─── -->
<div class="ctrl">
  <div class="sw">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="q" placeholder="Search sessions, topics, or things built…" autocomplete="off">
  </div>
  <div class="sep"></div>
  <div class="filters" id="flt">
    <button class="fb on" data-proj="all"><span>All</span><span class="n" id="all-n">0</span></button>
    <button class="fb" data-proj="meesterwerk"><span class="dot-f" style="background:#8b5cf640;border:1px solid #8b5cf660;border-radius:50%"></span><span>Meesterwerk</span></button>
    <button class="fb" data-proj="kubecraft"><span class="dot-f" style="background:#22c55e40;border:1px solid #22c55e60;border-radius:50%"></span><span>KubeCraft</span></button>
    <button class="fb" data-proj="hermes"><span class="dot-f" style="background:#38bdf840;border:1px solid #38bdf860;border-radius:50%"></span><span>Hermes</span></button>
    <button class="fb" data-proj="obsidian"><span class="dot-f" style="background:#a78bfa40;border:1px solid #a78bfa60;border-radius:50%"></span><span>Obsidian</span></button>
    <button class="fb" data-proj="general"><span class="dot-f" style="background:#64748b40;border:1px solid #64748b60;border-radius:50%"></span><span>General</span></button>
  </div>
</div>

<!-- ─── Body ─── -->
<div class="body" id="body">
  <div class="no-data">
    <div class="no-data-icon">◈</div>
    <h2>Loading insights…</h2>
    <p>Fetching session data. If this persists, Aurelius may not have logged any sessions yet.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PROJECT_COLORS = {
  meesterwerk: '#8b5cf6',
  kubecraft:   '#22c55e',
  hermes:      '#38bdf8',
  obsidian:    '#a78bfa',
  general:     '#64748b'
};

const PROJECT_LABELS = {
  meesterwerk: 'Meesterwerk',
  kubecraft:   'KubeCraft',
  hermes:      'Hermes',
  obsidian:    'Obsidian',
  general:     'General'
};

let sessions = [], activeProj = 'all', searchQ = '', lastUpdated = null;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function projColor(p){ return PROJECT_COLORS[p] || '#64748b'; }
function projLabel(p){ return PROJECT_LABELS[p] || (p ? p.charAt(0).toUpperCase()+p.slice(1) : 'General'); }

function formatDate(iso){
  if(!iso) return '';
  try{
    const d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }catch(e){ return iso; }
}

function ago(isoStr){
  if(!isoStr) return '—';
  const s = Math.round((Date.now() - new Date(isoStr)) / 1000);
  if(s < 60) return 'updated just now';
  const m = Math.floor(s/60);
  if(m < 60) return `updated ${m}m ago`;
  const h = Math.floor(m/60);
  if(h < 24) return `updated ${h}h ago`;
  return `updated ${Math.floor(h/24)}d ago`;
}

function updateTs(){ document.getElementById('ts').textContent = ago(lastUpdated); }

function setStats(stats){
  const s = stats || {};
  const sessEl = document.getElementById('stat-sessions');
  const builtEl = document.getElementById('stat-built');
  const builtSubEl = document.getElementById('stat-built-sub');
  const topicEl = document.getElementById('stat-topic');
  const topicSubEl = document.getElementById('stat-topic-sub');
  const recsEl = document.getElementById('stat-recs');

  sessEl.textContent = s.total_sessions_tracked != null ? s.total_sessions_tracked : '--';

  const built = s.things_built || [];
  builtEl.textContent = built.length || '--';
  builtSubEl.textContent = built.length ? built.slice(0,2).join(', ')+(built.length>2?' +more':'') : '';

  const topics = s.top_topics || [];
  topicEl.textContent = topics[0] || '--';
  topicSubEl.textContent = topics.slice(1,4).join(' · ');

  recsEl.textContent = s.recommendations_completed != null ? s.recommendations_completed : '--';
}

function updateFilterCounts(){
  const counts = {};
  sessions.forEach(s => { const p = s.project || 'general'; counts[p] = (counts[p]||0)+1; });
  const allN = document.getElementById('all-n');
  if(allN) allN.textContent = sessions.length;
  document.querySelectorAll('#flt .fb[data-proj]').forEach(btn => {
    const p = btn.dataset.proj;
    if(p === 'all') return;
    const n = counts[p] || 0;
    let nEl = btn.querySelector('.n');
    if(n > 0 && !nEl){
      nEl = document.createElement('span');
      nEl.className = 'n';
      btn.appendChild(nEl);
    }
    if(nEl) nEl.textContent = n;
    btn.style.display = n > 0 ? '' : '';
  });
}

function makeCard(s){
  const color = projColor(s.project);
  const label = projLabel(s.project);
  const badge_bg = `background:${color}18;color:${color};border:1px solid ${color}30`;
  const topic_bg = `background:${color}12;color:${color}cc;border:1px solid ${color}20`;
  const date = formatDate(s.date);

  const topics = (s.topics||[]).map(t =>
    `<span class="ctopic" style="${topic_bg}">${esc(t)}</span>`
  ).join('');

  const builtSection = (s.things_built && s.things_built.length) ? `
    <div class="csec">
      <div class="csec-lbl">Built</div>
      <div class="cchips">${s.things_built.map(b=>`<span class="cchip">${esc(b)}</span>`).join('')}</div>
    </div>` : '';

  const decisionsSection = (s.decisions && s.decisions.length) ? `
    <div class="csec">
      <div class="csec-lbl">Decided</div>
      <div class="cchips">${s.decisions.map(d=>`<span class="cchip">${esc(d)}</span>`).join('')}</div>
    </div>` : '';

  const promptText = `Summarise the "${esc(s.title)}" session`;

  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="cbar" style="background:${color}"></div>
    <div class="cin">
      <div class="ctop">
        <span class="cbadge" style="${badge_bg}">${esc(label)}</span>
        <span class="cdate">${esc(date)}</span>
      </div>
      <div class="cname">${esc(s.title||'Untitled session')}</div>
      ${s.summary ? `<div class="csummary">${esc(s.summary)}</div>` : ''}
      ${topics ? `<div class="ctopics">${topics}</div>` : ''}
      ${builtSection}
      ${decisionsSection}
    </div>
    <div class="cfoot">
      <span class="cprompt">${esc(promptText)}</span>
      <span class="ccopy" data-prompt="${esc(promptText)}">Copy</span>
    </div>`;

  el.querySelector('.ccopy').addEventListener('click', e => {
    e.stopPropagation();
    const btn = e.currentTarget;
    navigator.clipboard.writeText(btn.dataset.prompt).then(() => {
      btn.textContent = 'Copied ✓';
      btn.classList.add('ok');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1500);
    });
  });

  return el;
}

function render(){
  const body = document.getElementById('body');
  const q = searchQ.toLowerCase();

  // Filter
  const visible = sessions.filter(s => {
    const mp = activeProj === 'all' || (s.project||'general') === activeProj;
    if(!mp) return false;
    if(!q) return true;
    const hay = [s.title, s.summary, ...(s.topics||[]), ...(s.things_built||[]), ...(s.decisions||[]), s.project].join(' ').toLowerCase();
    return hay.includes(q);
  });

  document.getElementById('vc').textContent = visible.length;
  body.innerHTML = '';

  if(!sessions.length){
    body.innerHTML = `
      <div class="grid">
        <div class="empty">
          <span>◈</span>
          <h3>No sessions tracked yet</h3>
          <p>Aurelius will log session insights here automatically after each conversation.</p>
        </div>
      </div>`;
    return;
  }

  if(visible.length === 0){
    body.innerHTML = `
      <div class="grid">
        <div class="empty">
          <span>🔍</span>
          Nothing matches — try different keywords or clear the filter.
        </div>
      </div>`;
    return;
  }

  // Group by project for section headers
  const ORDER = ['meesterwerk','hermes','obsidian','kubecraft','general'];
  const groups = {};
  visible.forEach(s => {
    const p = s.project || 'general';
    if(!groups[p]) groups[p] = [];
    groups[p].push(s);
  });

  const keys = Object.keys(groups).sort((a,b) => ORDER.indexOf(a) - ORDER.indexOf(b));

  if(keys.length === 1 && activeProj !== 'all'){
    // Single project — no section header, just a flat grid
    const grid = document.createElement('div');
    grid.className = 'grid';
    groups[keys[0]].forEach(s => grid.appendChild(makeCard(s)));
    body.appendChild(grid);
  } else {
    keys.forEach(proj => {
      const color = projColor(proj);
      const label = projLabel(proj);
      const sec = document.createElement('div');
      sec.className = 'section';
      sec.innerHTML = `<div class="sh"><div class="sl"></div><div class="st"><div class="sd" style="background:${color}"></div>${esc(label)}<span class="sc">${groups[proj].length}</span></div><div class="sl"></div></div><div class="grid"></div>`;
      const grid = sec.querySelector('.grid');
      groups[proj].forEach(s => grid.appendChild(makeCard(s)));
      body.appendChild(sec);
    });
  }
}

// Filter buttons
document.querySelectorAll('#flt .fb').forEach(btn => {
  btn.addEventListener('click', () => {
    activeProj = btn.dataset.proj;
    document.querySelectorAll('#flt .fb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    render();
  });
});

// Search
document.getElementById('q').addEventListener('input', e => {
  searchQ = e.target.value;
  render();
});
document.addEventListener('keydown', e => {
  const qEl = document.getElementById('q');
  if(e.key === '/' && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); }
  if(e.key === 'Escape') document.getElementById('q').blur();
});

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function load(isUpdate){
  try{
    const r = await fetch('/insights.json?_='+Date.now(), {cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    sessions = data.sessions || [];
    lastUpdated = data.updated || null;
    setStats(data.stats || {});
    updateFilterCounts();
    render();
    updateTs();
    if(isUpdate) toast('Insights refreshed — '+sessions.length+' sessions');
  }catch(e){
    console.error('Failed to load insights.json:', e);
    if(!sessions.length){
      document.getElementById('body').innerHTML = `
        <div class="no-data">
          <div class="no-data-icon">◈</div>
          <h2>No sessions tracked yet</h2>
          <p>Aurelius will log session insights here automatically after each conversation.</p>
        </div>`;
    }
  }
}

setInterval(updateTs, 30000);
load(false);
setInterval(() => load(true), 60000);
</script>
</body>
</html>
